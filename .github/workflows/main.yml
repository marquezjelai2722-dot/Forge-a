name: Extract Forge ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Forge
        run: |
          set -e
          test -f Forge-connected-project.zip
          mkdir -p /tmp/forge-extract
          unzip -o Forge-connected-project.zip -d /tmp/forge-extract
          cp -r /tmp/forge-extract/Forge-connected-project/. .
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Extract Forge project files"
            git push
          fi
