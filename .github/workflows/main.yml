name: Extract Forge ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP into repository
        run: |
          unzip -o Forge-connected-project.zip -d .
          rm -rf Forge-connected-project
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Extract Forge project files" || echo "No changes to commit"
          git push
